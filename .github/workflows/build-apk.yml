name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/F1-Telemetry-Viewer.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: F1-Telemetry-Viewer-APK
          path: dist/F1-Telemetry-Viewer.apk
          if-no-files-found: error

      - name: Publish rolling release
        if: github.ref == 'refs/heads/claude/f1-telemetry-viewer-apk-lnl211'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: F1 Telemetry Viewer (latest build)
          body: |
            Automatically built debug APK of the F1 2025 Telemetry Viewer.
            Download `F1-Telemetry-Viewer.apk` below and install it on your Android device
            (enable "Install unknown apps" for your browser/file manager).
          files: dist/F1-Telemetry-Viewer.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
